<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Free QR Code Generator — Custom Colors, PNG &amp; SVG | Knottx</title>
    <meta
      name="description"
      content="Free QR code generator for links and text. Customize colors and dot styles, then download a high-resolution PNG or SVG. No sign-up, no watermark, and nothing leaves your browser."
    />
    <meta name="author" content="Visarut Tippun" />
    <link rel="canonical" href="https://knottx.dev/qr/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Knottx" />
    <meta property="og:title" content="Free QR Code Generator — Custom Colors, PNG &amp; SVG" />
    <meta property="og:description" content="Turn any link or text into a customizable QR code. Download PNG or SVG. Free, no sign-up, and generated privately in your browser." />
    <meta property="og:url" content="https://knottx.dev/qr/" />
    <meta property="og:image" content="https://knottx.dev/qr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QR Code Generator — create and customize QR codes privately in your browser." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free QR Code Generator — Custom Colors, PNG &amp; SVG" />
    <meta name="twitter:description" content="Turn any link or text into a customizable QR code. Download PNG or SVG. Free, no sign-up, and generated privately in your browser." />
    <meta name="twitter:image" content="https://knottx.dev/qr/og-image.png" />
    <meta name="twitter:image:alt" content="QR Code Generator — create and customize QR codes privately in your browser." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://knottx.dev/qr/#app",
            "name": "QR Code Generator",
            "url": "https://knottx.dev/qr/",
            "description": "Free QR code generator for links and text. Customize colors and dot styles, then download a high-resolution PNG or SVG. Runs entirely in your browser.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "isAccessibleForFree": true,
            "inLanguage": "en",
            "image": "https://knottx.dev/qr/og-image.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "QR codes for URLs and plain text with full UTF-8 support",
              "Custom foreground and background colors, with transparent background",
              "Square, rounded and dot styles for modules and corners",
              "Error correction levels L, M, Q and H",
              "PNG export up to 4096 px and SVG vector export",
              "Copy to clipboard",
              "No sign-up, no watermark, no tracking"
            ],
            "author": { "@id": "https://knottx.dev/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://knottx.dev/#person",
            "name": "Visarut Tippun",
            "url": "https://knottx.dev"
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Knottx", "item": "https://knottx.dev/" },
              { "@type": "ListItem", "position": 2, "name": "Tools", "item": "https://knottx.dev/tools/" },
              { "@type": "ListItem", "position": 3, "name": "QR Code Generator", "item": "https://knottx.dev/qr/" }
            ]
          }
        ]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('qr:theme') || '"system"');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0a0a' : '#fafafa');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6">
        <h1>Free QR Code Generator</h1>
        <p>
          Turn any link or text into a customizable QR code. Choose colors and dot styles, then
          download a high-resolution PNG or SVG. Free, with no sign-up or watermark.
        </p>
        <p>
          QR codes are generated locally in your browser, so this tool needs JavaScript. Please
          enable it to continue.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
